<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Trustline Collection Services | Recover Smart. Build Trust.</title>
    <meta
      name="description"
      content="Professional debt collection and financial recovery management solutions designed for India's banks, NBFCs, and lending institutions. Based in Bengaluru."
    />
    <meta property="og:title" content="Trustline Collection Services | Recover Smart. Build Trust." />
    <meta
      property="og:description"
      content="Ethical communication, transparent processes, and structured financial recovery for India's banks, NBFCs, and lending companies."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F8FAFC] text-[#0B1F3A] antialiased selection:bg-[#C6973F]/20 selection:text-[#0B1F3A]">
    <!-- Netlify Forms detection stubs -->
    <form name="business-consultation" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="referenceId" />
      <input type="text" name="fullName" />
      <input type="text" name="companyName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="industry" />
      <input type="text" name="service" />
      <textarea name="message"></textarea>
    </form>
    <form name="career-application" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="referenceId" />
      <input type="text" name="jobTitle" />
      <input type="text" name="fullName" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="experienceYears" />
      <input type="text" name="preferredLanguage" />
      <textarea name="coverNote"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
